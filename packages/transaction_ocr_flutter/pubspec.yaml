name: transaction_ocr_flutter
description: A high-performance, on-device Flutter OCR package for receipts and transaction extraction using ONNX Runtime Mobile and versioned rule consolidation.
version: 1.0.0
homepage: https://github.com/user/transaction_ocr_flutter

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.2.0
  image: ^4.2.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/models/v1.0.0/det_v1.onnx
    - assets/models/v1.0.0/rec_v1.onnx
    - assets/models/v1.0.0/cls_v1.onnx
    - assets/models/v1.0.0/keys_v1.txt
    - assets/models/v1.0.0/rules_manifest.json
